name: renovate-trivy

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["k8s/**", "renovate.json", ".github/workflows/renovate-trivy.yml"]

concurrency:
  group: renovate-trivy
  cancel-in-progress: false

permissions: {}

jobs:
  # Renovate and Trivy run here with a read-only token.
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aslafy-z/renovate-trivy@main
        with:
          step: scan
          data-repository: aslafy-z/renovate-trivy-data
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delta
          path: ${{ runner.temp }}/renovate-trivy-delta
          include-hidden-files: true
          retention-days: 7

  # Only git and renovate-trivy run here; this job alone holds the data token.
  publish:
    needs: scan
    runs-on: ubuntu-latest
    permissions: {}
    env:
      HAS_TOKEN: ${{ secrets.RENOVATE_TRIVY_DATA_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::warning::RENOVATE_TRIVY_DATA_TOKEN is not set, nothing published. See the README."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: delta
          path: ${{ runner.temp }}/renovate-trivy-delta
      - if: env.HAS_TOKEN == 'true'
        uses: aslafy-z/renovate-trivy@main
        with:
          step: publish
          data-repository: aslafy-z/renovate-trivy-data
          data-token: ${{ secrets.RENOVATE_TRIVY_DATA_TOKEN }}
