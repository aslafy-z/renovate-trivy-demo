# A CloudNativePG Cluster names its image in `imageName`, which no built-in
# Renovate manager reads: a custom regex manager in renovate.json does.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11
  storage:
    size: 1Gi
