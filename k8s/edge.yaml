# Two images Renovate groups in one branch ("edge", see renovate.json).
# Renovate schedules a branch as a whole, so when one member fixes CVEs the
# other has to be released with it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  selector:
    matchLabels: { app: argocd-server }
  template:
    metadata:
      labels: { app: argocd-server }
    spec:
      containers:
        - name: argocd-server
          image: quay.io/argoproj/argocd:v3.6.1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
spec:
  selector:
    matchLabels: { app: haproxy }
  template:
    metadata:
      labels: { app: haproxy }
    spec:
      containers:
        - name: haproxy
          image: haproxy:3.4.7-alpine
